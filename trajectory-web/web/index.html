<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>轨迹观察 · pi-chat-helper</title>
	<link rel="stylesheet" href="/tokens.css">
	<link rel="stylesheet" href="/style.css">
	<script>window.__TW_BOOT__ = /*__TW_BOOT__*/ null;</script>
	<script src="/vendor/markdown-it.min.js" defer></script>
</head>
<body>
	<script>
		// 主题引导：服务端注入 __TW_BOOT__，解析期即应用偏好，避免暗色用户首帧闪浅色。
		(() => {
			const pref = window.__TW_BOOT__?.theme || "system";
			const dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
			if (dark) document.body.toggleAttribute("data-ds-dark-theme", true);
			document.documentElement.dataset.dsThemeSource = pref;
			document.documentElement.style.colorScheme = dark ? "dark" : "light";
		})();
	</script>
	<header id="topbar">
		<nav class="workspace-tabs" aria-label="工作区切换">
			<button class="workspace-tab active" type="button" data-workspace="trace" aria-current="page"><span class="tab-mark" aria-hidden="true"></span>轨迹</button>
			<button class="workspace-tab" type="button" data-workspace="knowledge" disabled title="下一步实现"><span class="tab-mark" aria-hidden="true"></span>知识</button>
			<button class="workspace-tab" type="button" data-workspace="distill" disabled title="下一步实现"><span class="tab-mark" aria-hidden="true"></span>任务</button>
		</nav>
		<div class="topbar-right">
			<span id="sync-dot" class="dot"></span>
			<span id="sync" class="sync">—</span>
			<button id="theme-btn" class="tb-btn icon-btn" type="button" title="主题：跟随系统（点击切换）" aria-label="主题：跟随系统（点击切换）"></button>
			<button id="chat-btn" class="tb-btn icon-btn" type="button" title="打开侧边对话" aria-label="打开侧边对话" aria-pressed="false">
				<svg class="tb-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3c0-.9.7-1.6 1.6-1.6h4.8c.9 0 1.6.7 1.6 1.6v3c0 .9-.7 1.6-1.6 1.6H5.5L3.7 9.8V7.6h-.1C2.7 7.6 2 6.9 2 6z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
			</button>
		</div>
	</header>
	<div id="layout">
		<aside id="sidebar">
			<nav id="agent-rail" class="agent-rail" aria-label="对话来源选择">
				<div class="source-picker">
					<label class="source-picker-label" for="trace-source-select">对话来源</label>
					<div class="source-select-wrap">
						<span id="source-select-icon" class="source-select-icon" aria-hidden="true">π</span>
						<select id="trace-source-select"></select>
						<span class="source-select-chevron" aria-hidden="true">⌄</span>
					</div>
					<div id="source-picker-hint" class="source-picker-hint"></div>
				</div>
			</nav>
			<section id="session-section" class="sidebar-block session-section">
				<div class="section-head">
					<button id="groups-toggle" class="section-toggle" type="button" aria-expanded="true" title="收起所有分组">
						<span class="section-chev" aria-hidden="true">▾</span>
						<span class="section-title">会话</span>
					</button>
					<span id="source-session-count" class="side-count"></span>
				</div>
				<div class="sidebar-search">
					<input id="session-search" type="search" placeholder="搜索会话" aria-label="搜索会话">
				</div>
				<div id="session-list" class="session-list" aria-label="会话列表"></div>
			</section>
		</aside>
		<main id="main">
			<div id="trace-intro" class="trace-intro">
				<div id="trace-intro-title" class="trace-intro-title"></div>
				<div id="trace-intro-sub" class="trace-intro-sub"></div>
			</div>
			<div id="toolbar" class="toolbar" role="toolbar" aria-label="轨迹工具栏">
				<button id="back-main" class="tb-btn" type="button" hidden title="返回主会话"><span class="tb-icon" aria-hidden="true">⟨</span><span>主会话</span></button>
				<span class="tb-sep" aria-hidden="true"></span>
				<button id="fold-all" class="tb-btn" type="button" aria-pressed="false" title="收起所有轮次">
					<span id="fold-icon" class="tb-icon" aria-hidden="true">⊟</span><span>轮次</span>
				</button>
				<span class="tb-sep" aria-hidden="true"></span>
				<div id="filter-root" class="menu-root">
					<button id="filter-btn" class="tb-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="过滤显示的类型">
						<svg class="tb-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.6 2.6h8.8L7.1 6.4v3.1L4.9 8.2V6.4z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
						<span id="filter-label">过滤</span>
					</button>
					<div id="filter-menu" class="menu" role="menu" hidden></div>
				</div>
				<button id="crop-btn" class="tb-btn" type="button" aria-pressed="false" title="裁剪模式：把对话从模型上下文剪掉">
					<svg class="tb-icon" viewBox="0 0 12 12" aria-hidden="true"><circle cx="3" cy="9.2" r="1.7" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="9" cy="9.2" r="1.7" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M4.15 8.05 9.3 2.2M7.85 8.05 2.7 2.2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
					<span id="crop-label">裁剪</span>
				</button>
				<button id="distill-btn" class="tb-btn" type="button" aria-pressed="false" title="蒸馏模式：勾选要蒸馏的条目">
					<svg class="tb-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.8 1.8h2.4M5.6 1.8v3.3L2.9 9.7c-.3.5.1 1.1.7 1.1h4.8c.6 0 1-.6.7-1.1L6.4 5.1V1.8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
					<span id="distill-label">蒸馏</span>
				</button>
				<label class="tb-search" title="搜索轨迹">
					<svg class="tb-search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
					<input id="search" type="search" placeholder="搜索" aria-label="搜索轨迹">
				</label>
			</div>
			<div id="main-inner" class="main-inner"></div>
		</main>
		<!-- 侧边对话栏（分屏）：参与 #layout 的 flex 布局，打开时主区收窄不覆盖；顶栏按钮开关 -->
		<aside id="chat-drawer" class="chat-drawer" hidden>
			<div id="chat-resize" class="chat-resize" role="separator" aria-orientation="vertical" aria-label="调整对话栏宽度" tabindex="0" title="拖动调整宽度（双击恢复默认）"></div>
			<div id="chat-list" class="chat-list" role="log" aria-live="polite" aria-label="对话消息"></div>
			<div id="chat-announcer" class="chat-sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
			<div class="chat-composer">
				<div id="composer-resize" class="composer-resize" role="separator" aria-orientation="horizontal" aria-label="调整输入区高度" tabindex="0" title="拖动调整输入区高度（双击恢复默认）"></div>
				<div class="chat-card">
					<div class="chat-overlay-anchor">
						<div id="chat-palette" class="chat-palette" hidden>
							<div class="chat-palette-head">
								<input
									id="chat-palette-search"
									class="chat-palette-search"
									type="search"
									autocomplete="off"
									spellcheck="false"
									aria-controls="chat-palette-list"
									aria-autocomplete="list"
									placeholder="搜索命令…"
									aria-label="搜索命令…"
								/>
							</div>
							<div id="chat-palette-list" class="chat-palette-list" role="listbox" aria-label="斜杠命令"></div>
						</div>
						<div id="chat-profile-menu" class="chat-profile-menu" role="menu" hidden></div>
						<div id="chat-forward-target-menu" class="chat-profile-menu" role="menu" hidden></div>
						<div id="chat-forward-delivery-menu" class="chat-profile-menu" role="menu" hidden></div>
						<div id="chat-context-menu" class="chat-context-menu" role="dialog" aria-label="上下文" hidden></div>
					</div>
					<div class="chat-accessory">
						<button id="chat-mode-toggle" class="chat-mode-toggle" type="button" aria-pressed="false" title="切换到转发模式">独立</button>
						<button id="chat-context" class="chat-context" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="chat-context-menu" aria-label="打开上下文列表" title="取消勾选只影响之后的读取" hidden></button>
						<div id="chat-skill" class="chat-skill" hidden></div>
					</div>
					<div class="chat-scroll">
						<div class="chat-grow">
							<textarea id="chat-input" class="chat-input" rows="1" placeholder="问问这条轨迹…" aria-label="对话输入"></textarea>
						</div>
					</div>
					<div class="chat-row">
						<div class="chat-tools">
							<button id="chat-add" class="chat-add" type="button" title="命令菜单" aria-label="打开命令菜单" aria-haspopup="listbox" aria-expanded="false">
								<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
							</button>
							<div class="chat-modes">
								<button id="chat-profile" class="chat-profile" type="button" title="工具权限" aria-haspopup="menu" aria-expanded="false">
									<span id="chat-profile-label" class="chat-trigger-label">只读</span>
									<svg class="chat-trigger-chevron" viewBox="0 0 12 12" width="12" height="12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
								</button>
							</div>
							<button id="chat-forward-target" class="chat-forward-target" type="button" hidden aria-haspopup="menu" aria-expanded="false" title="转发目标">
								<span class="console-status-dot" aria-hidden="true"></span>
								<span id="chat-forward-target-label" class="chat-trigger-label">自动</span>
								<svg class="chat-trigger-chevron" viewBox="0 0 12 12" width="12" height="12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
							</button>
							<button id="chat-forward-delivery" class="chat-forward-delivery" type="button" hidden aria-haspopup="menu" aria-expanded="false" title="控制台忙碌时的转发方式">
								<span id="chat-forward-delivery-label" class="chat-trigger-label">排队</span>
								<svg class="chat-trigger-chevron" viewBox="0 0 12 12" width="12" height="12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
							</button>
						</div>
						<div class="chat-trailing">
							<div class="chat-standard-controls">
								<button id="chat-model-label" class="chat-model-label" type="button" aria-haspopup="menu" aria-expanded="false" title="模型与思考级别">
									<span id="chat-model-name" class="chat-trigger-label">读取模型中…</span>
									<span id="chat-thinking" class="chat-model-effort" title="思考级别">—</span>
									<svg class="chat-trigger-chevron" viewBox="0 0 12 12" width="12" height="12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
								</button>
							</div>
							<button id="chat-send" class="chat-send" type="button" title="发送（Enter）" aria-label="发送" disabled>
								<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 12V4M8 4 4.5 7.5M8 4l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
							</button>
						</div>
					</div>
				</div>
			</div>
			<div id="chat-approval" class="chat-approval" hidden role="dialog" aria-modal="true" aria-label="工具审批"></div>
		</aside>
	</div>
	<!-- 详情弹窗：点轨迹行后居中弹出（不再行内联展开）；点遮罩/Esc/再点同一行关闭。
	     工具条（译/⧉/⚙）随面板常驻，仍作用于当前打开的这一行。 -->
	<div id="ev-overlay" class="ev-overlay" hidden>
		<article id="ev-panel" class="ev-panel" role="dialog" aria-modal="true" aria-label="事件详情">
			<header class="ev-panel-head">
				<span class="ev-panel-grip" aria-hidden="true">⠿</span>
				<div class="ev-panel-tools">
					<button id="dv-translate" class="dv-tool-btn" type="button" title="翻译正文（再次点击恢复原文）" aria-pressed="false"><span aria-hidden="true">译</span></button>
					<div id="dv-copy-root" class="menu-root">
						<button id="dv-copy" class="dv-tool-btn" type="button" title="复制正文" aria-haspopup="menu" aria-expanded="false"><span aria-hidden="true">⧉</span></button>
						<div id="dv-copy-menu" class="menu" role="menu" hidden>
							<button class="menu-item" type="button" role="menuitem" data-copy="trans"><span class="menu-item-label">仅复制译文</span></button>
							<button class="menu-item" type="button" role="menuitem" data-copy="all"><span class="menu-item-label">全部（原文＋译文）</span></button>
						</div>
					</div>
					<div id="dv-settings-root" class="menu-root">
						<button id="dv-settings" class="dv-tool-btn" type="button" title="翻译设置" aria-haspopup="menu" aria-expanded="false"><span aria-hidden="true">⚙</span></button>
						<div id="dv-settings-menu" class="menu" role="menu" hidden></div>
					</div>
				</div>
				<div id="dv-close-root" class="ev-panel-close">
					<button id="dv-close" class="dv-tool-btn" type="button" title="关闭" aria-label="关闭详情">✕</button>
				</div>
			</header>
			<div id="dv-meta" class="dv-meta"></div>
			<div id="dv-body" class="dv-body"></div>
			<span class="ev-panel-resize" aria-hidden="true"></span>
		</article>
	</div>
	<script type="module" src="/app.js"></script>
</body>
</html>
