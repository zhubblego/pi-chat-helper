<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>轨迹观察 · pi-chat-helper</title>
	<link rel="stylesheet" href="/tokens.css">
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<header id="topbar">
		<div class="brand">
			<span id="sync-dot" class="dot"></span>
			<span class="brand-name">轨迹观察</span>
		</div>
		<div id="session-meta" class="session-meta">加载中…</div>
		<div class="topbar-right">
			<span id="scope-badge" class="scope-badge"></span>
			<span id="sync" class="sync">—</span>
			<button id="refresh" class="btn" title="立即刷新">刷新</button>
		</div>
	</header>
	<div id="layout">
		<aside id="sidebar">
			<section id="session-section" class="sidebar-block session-section">
				<div class="section-head">
					<span class="section-title">会话</span>
					<span id="session-count" class="section-count"></span>
				</div>
				<div id="session-list" class="session-list" aria-label="会话列表"></div>
			</section>
			<nav id="question-list" class="question-list" aria-label="提问列表"></nav>
		</aside>
		<main id="main">
			<div id="toolbar" class="toolbar" role="toolbar" aria-label="轨迹工具栏">
				<span class="tb-sep" aria-hidden="true"></span>
				<button id="fold-all" class="tb-btn" type="button" aria-pressed="false" title="收起所有轮次">
					<span id="fold-icon" class="tb-icon" aria-hidden="true">⊟</span><span>轮次</span>
				</button>
				<span class="tb-sep" aria-hidden="true"></span>
				<div id="filter-root" class="menu-root">
					<button id="filter-btn" class="tb-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="过滤显示的类型">
						<svg class="tb-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.6 2.6h8.8L7.1 6.4v3.1L4.9 8.2V6.4z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
						<span id="filter-label">过滤</span>
					</button>
					<div id="filter-menu" class="menu" role="menu" hidden></div>
				</div>
				<label class="tb-search" title="搜索轨迹">
					<svg class="tb-search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
					<input id="search" type="search" placeholder="搜索" aria-label="搜索轨迹">
				</label>
			</div>
			<div id="main-inner" class="main-inner"></div>
		</main>
	</div>
	<aside id="drawer" class="drawer" hidden>
		<header class="drawer-head">
			<span id="dv-kind" class="dv-kind"></span>
			<span id="dv-title" class="dv-title"></span>
			<button id="drawer-close" class="btn icon" title="关闭（Esc）">✕</button>
		</header>
		<div id="dv-meta" class="dv-meta"></div>
		<div id="dv-body" class="dv-body"></div>
	</aside>
	<script type="module" src="/app.js"></script>
</body>
</html>
