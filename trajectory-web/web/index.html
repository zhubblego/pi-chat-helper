<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>轨迹观察 · pi-chat-helper</title>
	<link rel="stylesheet" href="/tokens.css">
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<script>
		// 主题引导：解析期即应用持久化偏好，避免暗色用户首帧闪浅色（键与 app.js 的 tw.theme 一致）
		(() => {
			let pref = "system";
			try { pref = localStorage.getItem("tw.theme") || "system"; } catch { /* 无痕模式等场景忽略 */ }
			const dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
			if (dark) document.body.toggleAttribute("data-ds-dark-theme", true);
			document.documentElement.dataset.dsThemeSource = pref;
			document.documentElement.style.colorScheme = dark ? "dark" : "light";
		})();
	</script>
	<header id="topbar">
		<div class="brand">
			<span id="sync-dot" class="dot"></span>
			<span class="brand-name">轨迹观察</span>
		</div>
		<div id="session-meta" class="session-meta">加载中…</div>
		<div class="topbar-right">
			<button id="theme-btn" class="tb-btn theme-btn" type="button" title="主题：跟随系统（点击切换）" aria-label="主题：跟随系统（点击切换）"></button>
			<span id="scope-badge" class="scope-badge"></span>
			<span id="sync" class="sync">—</span>
		</div>
	</header>
	<div id="layout">
		<aside id="sidebar">
			<section id="session-section" class="sidebar-block session-section">
				<div class="section-head">
					<span class="section-title">会话</span>
					<span id="session-count" class="section-count"></span>
				</div>
				<div id="session-list" class="session-list" aria-label="会话列表"></div>
			</section>
		</aside>
		<main id="main">
			<div id="toolbar" class="toolbar" role="toolbar" aria-label="轨迹工具栏">
				<span class="tb-sep" aria-hidden="true"></span>
				<button id="fold-all" class="tb-btn" type="button" aria-pressed="false" title="收起所有轮次">
					<span id="fold-icon" class="tb-icon" aria-hidden="true">⊟</span><span>轮次</span>
				</button>
				<span class="tb-sep" aria-hidden="true"></span>
				<div id="filter-root" class="menu-root">
					<button id="filter-btn" class="tb-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="过滤显示的类型">
						<svg class="tb-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.6 2.6h8.8L7.1 6.4v3.1L4.9 8.2V6.4z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
						<span id="filter-label">过滤</span>
					</button>
					<div id="filter-menu" class="menu" role="menu" hidden></div>
				</div>
				<label class="tb-search" title="搜索轨迹">
					<svg class="tb-search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
					<input id="search" type="search" placeholder="搜索" aria-label="搜索轨迹">
				</label>
			</div>
			<div id="main-inner" class="main-inner"></div>
		</main>
	</div>
	<aside id="drawer" class="drawer" hidden>
		<div id="dv-side" class="dv-side" data-open="true">
			<div class="dv-side-tools">
				<button id="dv-translate" class="dv-side-btn" type="button" title="翻译正文（再次点击恢复原文）" aria-pressed="false"><span aria-hidden="true">译</span></button>
				<div id="dv-copy-root" class="menu-root">
					<button id="dv-copy" class="dv-side-btn" type="button" title="复制正文" aria-haspopup="menu" aria-expanded="false"><span aria-hidden="true">⧉</span></button>
					<div id="dv-copy-menu" class="menu" role="menu" hidden>
						<button class="menu-item" type="button" role="menuitem" data-copy="trans"><span class="menu-item-label">仅复制译文</span></button>
						<button class="menu-item" type="button" role="menuitem" data-copy="all"><span class="menu-item-label">全部（原文＋译文）</span></button>
					</div>
				</div>
				<div id="dv-settings-root" class="menu-root">
					<button id="dv-settings" class="dv-side-btn" type="button" title="抽屉设置" aria-haspopup="menu" aria-expanded="false"><span aria-hidden="true">⚙</span></button>
					<div id="dv-settings-menu" class="menu" role="menu" hidden></div>
				</div>
			</div>
			<button id="dv-side-toggle" class="dv-side-toggle" type="button" title="收起工具条"><span aria-hidden="true">«</span></button>
		</div>
		<header class="drawer-head">
			<span id="dv-kind" class="dv-kind"></span>
			<span id="dv-title" class="dv-title"></span>
			<button id="drawer-close" class="btn icon" title="关闭（Esc）">✕</button>
		</header>
		<div id="dv-meta" class="dv-meta"></div>
		<div id="dv-body" class="dv-body"></div>
	</aside>
	<script type="module" src="/app.js"></script>
</body>
</html>
